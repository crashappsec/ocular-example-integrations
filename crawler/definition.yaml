apiVersion: ocular.crashoverride.run/v1beta1
kind: Crawler
metadata:
  name: <YOUR CRAWLER NAME HERE>
spec:
  container:
    name: crawler
    image: example-crawler:latest
    imagePullPolicy: IfNotPresent
  parameters:
    - name: "PROFILE"
      required: false
      default: "default"
    - name: "DOWNLOADER"
      required: true
